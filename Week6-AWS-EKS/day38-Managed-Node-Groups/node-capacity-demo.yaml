apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-capacity-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-capacity-demo
  template:
    metadata:
      labels:
        app: node-capacity-demo
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
